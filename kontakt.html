<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kochwelt - Kontakt</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap" rel="stylesheet" />
  <link rel="icon" href="img/favicon.png" />
</head>
<body>
  <header>
    <a href="index.html">
      <img src="img/logo.png" alt="Kochwelt Logo" width="120" />
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="rezepte.html">Rezepte</a></li>
        <li><a href="kontakt.html" class="active">Kontakt</a></li>
        <li><a href="impressum.html">Impressum</a></li>
      </ul>
    </nav>
    <button id="burgerBtn" aria-label="Menü öffnen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main>
    <h1>Kontakt zur Kochwelt</h1>
    <p>Schreib uns eine Nachricht – wir freuen uns auf dich!</p>

    <section id="kontaktbereich">
      <form id="kontaktForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required />

        <label for="email">E-Mail:</label>
        <input type="email" id="email" required />

        <label for="nachricht">Nachricht:</label>
        <textarea id="nachricht" rows="5" required></textarea>

        <p id="fehlerText" style="color: red;"></p>

        <button type="submit">Senden</button>
      </form>
    </section>
  </main>

<footer>
  <p>&copy; 2025 Kochwelt – Alle Rechte vorbehalten.</p>
  <p>
    <a href="impressum.html">Impressum</a> |
    <a href="kontakt.html">Kontakt</a>
  </p>
</footer>


  <script src="script.js"></script>
</body>
</html>
